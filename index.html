<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoop Manager</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    /* Prevent install button from flickering on refresh */
    #install-btn {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Install App Button (Hidden by default) -->
  <button id="install-btn">Install App</button>

  <script>
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then((reg) => console.log('Service Worker registered successfully.', reg))
          .catch((err) => console.log('Service Worker registration failed:', err));
      });
    }

    // Install Button Logic (Prevents Flickering)
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installBtn) {
        installBtn.style.display = 'inline-block';
      }
    });

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log(`Install prompt outcome: ${outcome}`);
          deferredPrompt = null;
          installBtn.style.display = 'none';
        }
      });
    }

    window.addEventListener('appinstalled', () => {
      if (installBtn) {
        installBtn.style.display = 'none';
      }
    });

    // Keyboard Shortcut: Press Control Key Alone to Open New Order
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Control') {
        e.preventDefault();
        
        const newOrderBtn = document.querySelector('.new-order-btn') || 
                            Array.from(document.querySelectorAll('button')).find(btn => btn.textContent.includes('New Order'));
                            
        if (newOrderBtn) {
          newOrderBtn.click();
        }
      }
    });
  </script>
</body>
</html>
